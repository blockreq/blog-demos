name: demos1

on:
  pull_request:
    # ready_for_review runs the fast tier when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/demos1/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/demos1.yml"
  push:
    branches: [main]
    paths:
      - "apps/demos1/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/demos1.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Worker blockreq-demos1 (requires CF secrets)"
        type: boolean
        default: false

# Cancel superseded PR runs only. Pushes to main are never cancelled.
concurrency:
  group: demos1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build demos1
    # Fast tier ceiling. Recent successful jobs finished in about 30s.
    timeout-minutes: 10
    # Drafts skip CI. Push and workflow_dispatch always build.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: apps/demos1/tsconfig.tsbuildinfo
          key: tsc-demos1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', 'apps/demos1/tsconfig.json', 'apps/demos1/src/**', 'packages/**/src/**', 'packages/**/tsconfig.json') }}
          restore-keys: |
            tsc-demos1-${{ runner.os }}-
      - name: Install
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        timeout-minutes: 6
        run: pnpm --filter @blockreq/demos1 build
      - name: Upload dist (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: demos1-dist
          path: apps/demos1/dist
          if-no-files-found: error

  deploy:
    name: Deploy Worker (workflow_dispatch only)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile
      - name: Build
        timeout-minutes: 6
        run: pnpm --filter @blockreq/demos1 build
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN missing. Set org/repo secret (Workers Edit)."
            exit 1
          fi
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID:-${CF_ACCOUNT_ID:-}}"
          if [ -z "$ACCOUNT" ]; then
            echo "::error::Set CF_ACCOUNT_ID or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
      - name: Deploy
        timeout-minutes: 10
        working-directory: apps/demos1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
