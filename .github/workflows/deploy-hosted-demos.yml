name: Deploy hosted demo apps (CF Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/deploy-hosted-demos.yml"
  workflow_dispatch:

concurrency:
  group: hosted-demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: anoncoin-rh-launch-listen
            blog_url: https://blockreq.com/blog/en/anoncoin-rh-launch-listen
          - app: openlaunch-base-eth-subscribe
            blog_url: https://blockreq.com/blog/en/openlaunch-base-eth-subscribe
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Build static export
        working-directory: apps/${{ matrix.app }}
        env:
          NEXT_PUBLIC_BLOG_URL: ${{ matrix.blog_url }}
          NEXT_PUBLIC_SIGNUP_URL: https://blockreq.com/pricing
        run: npm run build

      - name: Ensure Pages project exists
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN missing. Boss: copy the working token from blockreq/core (or create an API token with Account · Cloudflare Pages · Edit + Account Settings · Read) into org/repo secrets for blog-demos."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CF_ACCOUNT_ID missing (expected ad9331a749fc4b76fe53d6f14fbc8471)."
            exit 1
          fi
          # Create is idempotent enough: ignore "already exists"
          set +e
          OUT=$(npx wrangler pages project create "${{ matrix.app }}" --production-branch=main 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUT" | grep -qiE 'already exists|Project already exists'; then
              echo "Project already exists — continuing"
            elif echo "$OUT" | grep -qi 'Authentication error'; then
              echo "::error::CF token lacks Pages permission (auth 10000). Boss steps:"
              echo "1) Cloudflare Dashboard → Workers & Pages → Create application → Pages → Direct Upload"
              echo "   Create projects: anoncoin-rh-launch-listen AND openlaunch-base-eth-subscribe (production branch main)"
              echo "2) My Profile → API Tokens → Create Token with Account·Cloudflare Pages·Edit (+ Account Settings·Read)"
              echo "3) Set org/repo secret CLOUDFLARE_API_TOKEN on blockreq (or repo secret on blog-demos) to that token"
              echo "4) Ensure repo secret CF_ACCOUNT_ID=ad9331a749fc4b76fe53d6f14fbc8471"
              echo "5) Re-run workflow: gh workflow run deploy-hosted-demos.yml -R blockreq/blog-demos"
              exit 1
            else
              exit "$CODE"
            fi
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy out             --project-name="${{ matrix.app }}"             --branch=main             --commit-dirty=true 2>&1 | tee /tmp/pages-deploy.log
          URL=$(grep -oE 'https://[^ ]+\.pages\.dev' /tmp/pages-deploy.log | head -1 || true)
          echo "url=${URL:-https://${{ matrix.app }}.pages.dev}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Blog: ${{ matrix.blog_url }}" >> "$GITHUB_STEP_SUMMARY"
