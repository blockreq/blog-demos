name = "blockreq-demos1"
main = "src/worker.ts"
compatibility_date = "2026-09-09"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA under /demos1/* — Worker rewrites unknown paths to index.html via assets.
not_found_handling = "single-page-application"
run_worker_first = true

# Production host route blockreq.com/demos1* is wired by Boss/gitops later.
# Local: pnpm --filter @blockreq/demos1 wrangler:dev
